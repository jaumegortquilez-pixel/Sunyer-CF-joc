<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Sunyer CF · 4a Catalana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Layout: nit de partit al Municipal de Sunyer — capçalera d'estadi amb focus, marcador LED, camp protagonista i targetes de jugador a sota */
:root{
  --bg:#F3EFEF; --surface:#FFFFFF; --ink:#1F1515; --muted:#6E5F5F; --line:#E4D8D8;
  --red:#C4122F; --red-ink:#FFFFFF; --red-soft:#F9E3E6; --gold:#F2C230;
  --good:#23794A; --bad:#B3261E; --warn:#A8690F;
  --night:#120D0E; --night-2:#1E1517; --night-ink:#FBF5F4; --night-dim:#A8938F; --led:#FFD23F;
  --terra:#B8875A; --gespa:#3F8C46; --gespa-2:#387F3F;
  --f-display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --f-label:"Barlow Condensed", "Arial Narrow", sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141011; --surface:#211A1B; --ink:#F3EAE8; --muted:#A99896; --line:#3A2D2E;
  --red:#E3344F; --red-soft:#3A1A1F; --good:#4CB97A; --bad:#F0685E; --warn:#E0A64A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141011; --surface:#211A1B; --ink:#F3EAE8; --muted:#A99896; --line:#3A2D2E;
  --red:#E3344F; --red-soft:#3A1A1F; --good:#4CB97A; --bad:#F0685E; --warn:#E0A64A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:900;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:.95}
h2{font-size:1.8rem;text-transform:uppercase}
h3{font-size:1.3rem;text-transform:uppercase}
.label{font-family:var(--f-label);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
.btn{font-family:var(--f-label);font-weight:800;font-size:1.02rem;letter-spacing:.07em;text-transform:uppercase;border:0;border-radius:8px;padding:.7em 1.25em;background:var(--red);color:var(--red-ink);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor;opacity:.9}
.btn.small{font-size:.85rem;padding:.45em .85em}
.btn.big{font-size:1.25rem;padding:.75em 1.6em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.session:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* Capçalera d'estadi */
.stadium{position:relative;overflow:hidden;border-radius:var(--radius);color:var(--night-ink);padding:18px 18px 16px;
  background:radial-gradient(120% 90% at 12% -20%,rgba(255,244,214,.35),transparent 55%),radial-gradient(120% 90% at 88% -20%,rgba(255,244,214,.28),transparent 55%),linear-gradient(180deg,var(--night-2),var(--night))}
.stadium::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:repeating-linear-gradient(90deg,var(--red) 0 22px,#fff 22px 44px)}
.stadium .top{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.stadium h1{font-size:clamp(2.1rem,8vw,3.3rem);text-transform:uppercase;letter-spacing:.02em}
.stadium .sub{font-family:var(--f-label);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--night-dim);font-size:.82rem}
.stadium .pills{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-family:var(--f-label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;padding:.3em .65em;border-radius:999px;background:rgba(255,255,255,.1);color:var(--night-ink);white-space:nowrap}
.pill b{color:var(--led)}
.pill.sound{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font:inherit;font-family:var(--f-label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;color:var(--night-ink)}
.pill.sound[aria-pressed="true"]{background:#C4122F}
.pill.sound:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lights{position:absolute;top:-10px;display:flex;gap:5px}
.lights i{width:7px;height:7px;border-radius:50%;background:#FFF6D8;box-shadow:0 0 12px 4px rgba(255,240,200,.55)}
.stadium .top>div{min-width:0;flex:1 1 180px}
@media (max-width:560px){.stadium .pills{margin-left:0;justify-content:flex-start;width:100%}.stadium .top{flex-wrap:wrap}}

/* Marcador LED */
.board{background:#0B0809;color:var(--night-ink);border-radius:var(--radius);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;border:2px solid #2B2022;box-shadow:inset 0 0 0 1px #000,0 6px 18px rgba(0,0,0,.18)}
.board .team{display:flex;align-items:center;gap:10px;min-width:0}
.board .team.right{flex-direction:row-reverse;text-align:right}
.board .team>div{min-width:0}.board .tname{overflow-wrap:anywhere}
@media (max-width:560px){.board .team svg{display:none}.board{padding:10px}}
.board .tname{font-family:var(--f-display);font-weight:900;font-size:clamp(1rem,4vw,1.55rem);text-transform:uppercase;line-height:1}
.board .tsub{font-family:var(--f-label);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--night-dim)}
.board .mid{display:flex;flex-direction:column;align-items:center;gap:2px}
.board .score{font-family:var(--f-display);font-weight:900;font-size:clamp(2.3rem,9vw,3.6rem);font-variant-numeric:tabular-nums;line-height:1;color:var(--led);text-shadow:0 0 10px rgba(255,210,63,.55);padding:0 8px;background:#050304;border-radius:6px}
.board .score span{color:#6B5A2A;padding:0 .12em}
.board .clock{font-family:var(--f-label);font-weight:700;letter-spacing:.14em;color:#FF6B6B;font-size:.85rem}

/* Pestanyes */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding-inline:16px;box-shadow:0 6px 10px -8px rgba(0,0,0,.25)}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--f-label);font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:none;border:0;padding:.6em .85em;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}

/* Cartell del partit */
.poster{position:relative;overflow:hidden;border-radius:var(--radius);color:var(--night-ink);padding:20px 18px;display:flex;flex-direction:column;gap:14px;
  background:linear-gradient(160deg,rgba(196,18,47,.35),transparent 45%),linear-gradient(180deg,#231819,#0F0B0C)}
.poster .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.poster .side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.poster .side b{font-family:var(--f-display);font-weight:900;font-size:clamp(1.15rem,4.6vw,1.9rem);text-transform:uppercase;line-height:1}
.poster .x{font-family:var(--f-display);font-weight:900;font-size:2.2rem;color:var(--led)}
.poster .when{font-family:var(--f-label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;color:#FF8A8A}
.poster .cta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.poster .hint{text-align:center;color:var(--night-dim);font-size:.85rem}
.xuts{display:flex;align-items:center;gap:10px;justify-content:center;font-family:var(--f-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.82rem;color:var(--night-ink)}
.xuts img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.pitchchip{font-family:var(--f-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;padding:.25em .65em;border-radius:999px;color:#fff;white-space:nowrap}
.pitchchip.terra{background:var(--terra)}.pitchchip.gespa{background:var(--gespa)}

/* Taules */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:.45em .5em;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-label);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.c,th.c{text-align:center}
tr.me td{background:var(--red-soft);font-weight:700}
.pos{display:inline-block;min-width:2.6em;text-align:center;font-family:var(--f-label);font-weight:800;font-size:.74rem;letter-spacing:.06em;border-radius:4px;padding:.1em .35em;background:var(--line);color:var(--ink)}
.pos.POR{background:#E9B949;color:#2A1D00}.pos.DEF{background:#3D6FB6;color:#fff}.pos.MIG{background:#2E8B57;color:#fff}.pos.DAV{background:#C4122F;color:#fff}
.inj{color:var(--bad);font-weight:700;font-family:var(--f-label)}
select,input[type=text]{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.3em .4em;max-width:100%}

/* Cartes de jugador */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{position:relative;border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.pcard .head{background:linear-gradient(135deg,#C4122F,#7E0B1E);color:#fff;padding:10px 10px 8px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;position:relative}
.pcard .head::after{content:"";position:absolute;right:-8px;top:-10px;width:62px;height:62px;border-radius:50%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 5px,transparent 5px 10px)}
.pcard .ovr{font-family:var(--f-display);font-weight:900;font-size:2.1rem;line-height:.9;grid-row:span 2}
.pcard .dor{font-family:var(--f-label);font-weight:700;font-size:.8rem;letter-spacing:.06em;opacity:.9}
.pcard .nm{padding:8px 10px 2px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.pcard .tag{padding:0 10px;font-size:.72rem;color:var(--muted);font-family:var(--f-label);letter-spacing:.06em;text-transform:uppercase}
.pcard .stats{display:grid;grid-template-columns:auto 1fr auto;gap:3px 6px;align-items:center;padding:8px 10px;font-family:var(--f-label);font-size:.75rem;font-weight:700}
.pcard .stats i{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.pcard .stats i b{display:block;height:100%;background:var(--red)}
.pcard .foot2{padding:0 10px 10px;display:flex;gap:8px;align-items:flex-end;justify-content:space-between}
.pcard input[type=number]::-webkit-inner-spin-button,.pcard input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pcard .fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.pcard input[type=number]{-moz-appearance:textfield;appearance:textfield;font:inherit;width:4.2em;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.3em .4em;font-variant-numeric:tabular-nums}
.pcard.hurt{opacity:.75}
.pcard .band{position:absolute;top:8px;right:8px;background:#fff;color:#B3261E;font-family:var(--f-label);font-weight:800;font-size:.7rem;letter-spacing:.06em;padding:.1em .45em;border-radius:4px;z-index:1}

/* Alineació */
.grid-xi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{display:flex;gap:8px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:.5em .6em;color:var(--ink);min-width:0}
.chip .n{font-family:var(--f-display);font-weight:900;font-size:1.25rem;width:1.6em;text-align:center}
.chip .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.chip .st{font-size:.75rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.chip:disabled{opacity:.45;cursor:not-allowed}

/* Partit */
.match{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
@media (max-width:720px){.match{grid-template-columns:1fr}}
.pitchbox{background:#0B0809;border-radius:var(--radius);padding:6px;position:relative;overflow:hidden}
svg.pitch{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.tok{cursor:grab}.tok:active{cursor:grabbing}
.tok:focus-visible{outline:none}.tok:focus-visible .shirt{stroke:var(--gold);stroke-width:1}
.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.overlay .big{font-family:var(--f-display);font-weight:900;font-size:clamp(2.6rem,12vw,5rem);text-transform:uppercase;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px rgba(0,0,0,.45);animation:pop .45s ease-out}
.overlay.goal{pointer-events:auto;cursor:pointer;background:radial-gradient(circle at 50% 45%,rgba(196,18,47,.92),rgba(60,4,14,.96) 70%);animation:fadein .25s ease-out}
.celebr{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:2;text-align:center;padding:0 10px}
.celebr img{width:clamp(110px,34vw,190px);height:auto;aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 5px #fff,0 0 0 10px #C4122F,0 0 50px 12px rgba(255,210,63,.6);animation:logo 1.1s cubic-bezier(.2,1.5,.4,1) both}
.celebr .gol{font-family:var(--f-display);font-weight:900;font-size:clamp(3.2rem,15vw,6.2rem);line-height:.9;color:#fff;letter-spacing:.02em;text-shadow:0 4px 0 #7E0B1E;animation:pop .5s .35s ease-out both}
.celebr .who{font-family:var(--f-label);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--led);font-size:clamp(.95rem,3.6vw,1.2rem);animation:pop .4s .6s ease-out both}
.scarf{position:absolute;left:0;right:0;bottom:10%;height:34px;background:repeating-linear-gradient(90deg,#C4122F 0 40px,#fff 40px 80px);transform:rotate(-4deg);overflow:hidden;display:flex;align-items:center;z-index:1;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.scarf span{white-space:nowrap;font-family:var(--f-display);font-weight:900;font-size:22px;color:#120D0E;letter-spacing:.08em;animation:marquee 3.2s linear infinite;text-shadow:0 0 3px #fff}
.celebr .chant{display:flex;flex-direction:column;gap:2px}
.celebr .chant span{font-family:var(--f-display);font-weight:900;font-size:clamp(1.3rem,5.4vw,2.2rem);color:var(--led);letter-spacing:.03em;text-shadow:0 3px 0 #7E0B1E;animation:chant .5s ease-out both}
@keyframes chant{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.conf{position:absolute;top:-12px;width:8px;height:14px;animation:fall linear forwards;z-index:1}
.tapskip{position:absolute;bottom:8px;right:10px;font-family:var(--f-label);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7);z-index:2}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes logo{0%{transform:scale(.2) rotate(-200deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes fall{to{transform:translateY(520px) rotate(720deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.overlay .big,.celebr img,.celebr .gol,.celebr .who,.scarf span,.conf,.celebr .chant span{animation:none!important}}
.plays{display:flex;gap:5px;flex-wrap:wrap}
.plays i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-label);font-weight:800;font-size:.7rem;border:1.5px solid var(--line);color:var(--muted)}
.plays i.cur{border-color:var(--red);color:var(--ink);box-shadow:0 0 0 2px var(--red-soft)}
.plays i.w{background:var(--good);border-color:var(--good);color:#fff}
.plays i.l{background:var(--bad);border-color:var(--bad);color:#fff}
.meter{display:flex;flex-direction:column;gap:4px}
.meter .bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;transition:width .25s}
.meter .pct{font-family:var(--f-display);font-weight:900;font-size:1.8rem;line-height:1}
.tip{background:var(--red-soft);border-radius:8px;padding:.6em .7em;font-size:.88rem}
.modebadge{font-family:var(--f-display);font-weight:900;font-size:1.45rem;text-transform:uppercase;padding:.08em .5em;border-radius:6px;color:#fff}
.modebadge.atac{background:#C4122F}.modebadge.defensa{background:#3D6FB6}
details.subs{border-top:1px solid var(--line);padding-top:8px}
details.subs summary{cursor:pointer;font-family:var(--f-label);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem}
.subform{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.subform label{font-size:.75rem;color:var(--muted);font-family:var(--f-label);letter-spacing:.06em;text-transform:uppercase}
.bench{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.staff{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center}
.staff .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--night);color:var(--night-ink);font-family:var(--f-label);font-weight:800;font-size:.75rem;border:2px solid #C4122F}
.staff b{display:block;font-size:.85rem;line-height:1.1}
.staff span{font-size:.72rem;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.log div{padding:.35em .55em;border-left:3px solid var(--line)}
.log .up{border-left-color:var(--good)}.log .down{border-left-color:var(--bad)}
.sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.session{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.75em;color:var(--ink)}
.session b{font-family:var(--f-display);font-weight:900;font-size:1.2rem;letter-spacing:.02em;text-transform:uppercase}
.session span{font-size:.8rem;color:var(--muted)}
.session:hover:not(:disabled){border-color:var(--red);transform:translateY(-1px)}
.session:disabled{opacity:.45;cursor:not-allowed}
.dots{display:flex;gap:4px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--red)}.dots i.off{background:var(--line)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.foot{font-size:.8rem;color:var(--muted)}
</style>

<div class="wrap" id="app"></div>

<script id="core">
/* ====== DADES ====== */
// Plantilla oficial 2026/27 (llista definitiva facilitada pel club). [nom, posició, àlies]
// La posició i el dorsal es poden canviar dins del joc; aquí hi ha l'oficial.
const PLANTILLA = [
  ["Adrián Martos","POR","Chucky"],
  ["Ivan Borrell","DEF"],["Pau Estopà","DEF"],["Guillermo Caballero","DEF"],["Noel Pujol","DEF"],["Quim Huguet","DEF"],
  ["Joel Tost","DEF"],["Santi Huguet","DEF"],["Cristian Espejo","DEF"],["Albert Ribes","DEF"],
  ["Joan Portero","MIG"],["Andreu Gàzquez","MIG"],["Tariq El Ouassile","MIG"],["Rubén Tovar","MIG"],["Gabriel Varela","MIG"],
  ["Robert Besó","DAV"],["Eloi Huguet","DAV"],["Fouad Ghali","DAV"],["Jonathan Espejo","DAV"],["Pau Varela","DAV"],
  ["Oriol Lozano","DAV"],["Robert Cormos","DAV"],["Abdourahmane Samba","DAV"]
];
const POS_OFICIAL=Object.fromEntries(PLANTILLA.map(([n,p])=>[n,p]));
const CAPITA = "Ivan Borrell";
const COS_TECNIC = [

/* ====== UTILITATS ====== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return (h>>>0)/4294967295;}
function seeded(s,a,b){return Math.round(a+hash(s)*(b-a));}
function initials(n){return n.split(" ").filter(w=>/^[A-ZÀ-Ý]/.test(w)).slice(0,2).map(w=>w[0]).join("")||n.slice(0,2).toUpperCase();}
const lastName=n=>{const p=n.split(" ");return p.length>1?p.slice(1).join(" "):n;};

/* ====== MOTOR DE LA JUGADA ======
   Coordenades del mig camp: x 0..100, y 0..68 (0 = línia de gol, porteria a dalt). */
const GOAL={x:50,y:0};
function zoneF(p){const d=dist(p,GOAL); if(d<6) return 0.8; if(d<=22) return 1; return Math.max(0.12,1-(d-22)/34);}
function central(p){return 1-Math.min(1,Math.abs(p.x-50)/60);}
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy||1;const t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/L,0,1);return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));}
function evalPlay(att,def,gk,bonus=0){
  if(!att.length) return {p:0.03,score:0,sh:null,passer:null,att};
  att.forEach(a=>{let pr=0;def.forEach(d=>{const w=Math.max(0,1-dist(a,d)/15)*(d.def/55);pr+=w*(d.y<a.y?1.25:0.8);});
    a.open=clamp(1-0.5*pr,0.05,1);a.q=(a.ata/55)*zoneF(a)*a.open*(0.6+0.4*central(a));});
  const sh=att.reduce((m,a)=>a.q>m.q?a:m);
  let sup=0.3,passer=null;
  att.filter(a=>a!==sh).forEach(o=>{const blk=def.filter(d=>segDist(d,o,sh)<5).length;const lane=clamp(1-0.3*blk,0.2,1);
    const v=o.open*lane*(o.ata+o.fis)/110;if(!passer||v>sup){sup=v;passer=o;}});
  const nf=att.length>=3?1:att.length==2?0.9:0.75;
  const score=(0.62*sh.q+0.38*sup)*nf+bonus;
  const p=clamp(1/(1+Math.exp(-6*(score-0.62-0.2*(gk/55)))),0.04,0.9);
  return {p,score,sh,passer,att};
}
const DEF_SETS={
  "Línia de quatre":[[20,22],[40,20],[60,20],[80,22],[50,40]],
  "Bloc baix":[[35,11],[50,9],[65,11],[30,25],[70,25]],
  "Pressió alta":[[25,38],[50,33],[75,38],[40,16],[60,16]],
  "Rombe":[[50,11],[30,25],[70,25],[50,40],[50,24]]
};
const ATT_SETS={
  "Atac per l'esquerra":[[16,18],[30,34],[48,26],[60,46],[80,40]],
  "Atac per la dreta":[[84,18],[70,34],[52,26],[40,46],[20,40]],
  "Atac pel centre":[[42,15],[58,15],[50,31],[34,45],[66,45]],
  "Contraatac":[[50,20],[28,30],[72,30],[50,55],[18,50]]
};
function oppFormation(kind,r){
  const [name,pts]=pick(Object.entries(kind==="atac"?DEF_SETS:ATT_SETS));
  return {name,men:pts.map(([x,y])=>({x:clamp(x+rnd(-3,3),4,96),y:clamp(y+rnd(-3,3),5,64),ata:r+rnd(-6,6),def:r+rnd(-6,6),fis:r}))};
}
if(typeof module!=="undefined") module.exports={evalPlay,oppFormation,DEF_SETS,ATT_SETS};
</script>

<script>
/* ====== ESTAT ====== */
const KEY="sunyercf-joc-v2";
const ME=0;
// Dorsals oficials 2026/27. Andreu Gàzquez encara sense número oficial (17 provisional).
const DORSALS={"Adrián Martos":19,"Ivan Borrell":6,"Pau Estopà":5,"Guillermo Caballero":16,"Noel Pujol":22,"Quim Huguet":10,"Joel Tost":25,
  "Santi Huguet":20,"Cristian Espejo":3,"Albert Ribes":2,"Joan Portero":8,"Andreu Gàzquez":17,"Tariq El Ouassile":11,"Rubén Tovar":15,
  "Gabriel Varela":4,"Robert Besó":13,"Eloi Huguet":7,"Fouad Ghali":12,"Jonathan Espejo":23,"Pau Varela":14,"Oriol Lozano":99,

// Nom curt que surt a la samarreta: el nom de pila, o el cognom si el nom es repeteix.
const CURT={"Adrián Martos":"Chucky","Robert Besó":"Besó","Robert Cormos":"Cormos","Pau Estopà":"Estopà","Pau Varela":"Varela","Cristian Espejo":"Cristian","Jonathan Espejo":"Jonathan","Abdourahmane Samba":"Abdou"};
const slug=n=>"p_"+n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z]+/g,"_");
let S=null, drag=null, busy=false, confirmReset=false;

function makePlayer(n,pos){
  const B={POR:{por:[56,64],def:[25,35],ata:[15,25],fis:[45,58]},DEF:{por:[5,12],def:[50,60],ata:[34,44],fis:[50,60]},
           MIG:{por:[5,12],def:[42,50],ata:[47,56],fis:[50,60]},DAV:{por:[5,12],def:[30,40],ata:[54,63],fis:[52,62]}}[pos];
  const alias=(PLANTILLA.find(r=>r[0]===n)||[])[2]||null;
  const p={id:slug(n),nom:n,alias,curt:CURT[n]||n.split(" ")[0],num:DORSALS[n]||99,pos,inj:0,cap:n===CAPITA};
  for(const k of ["por","def","ata","fis"]) p[k]=seeded(n+pos+k,B[k][0],B[k][1]);
  if(p.cap){p.def+=3;}
  if(alias==="Chucky"){p.por=66;}
  return p;
}
const shown=p=>p.alias||p.nom; // nom per a crònica i celebracions
const fullName=p=>p.alias?`${p.nom} «${p.alias}»`:p.nom;
function ovr(p,pos=p.pos){
  if(pos==="POR") return Math.round(p.por);
  if(pos==="DEF") return Math.round(.6*p.def+.2*p.fis+.2*p.ata);
  if(pos==="MIG") return Math.round(.4*p.ata+.35*p.def+.25*p.fis);
  return Math.round(.65*p.ata+.2*p.fis+.15*p.def);
}
function buildFixtures(){
  const n=10; let arr=[0,2,3,4,5,6,7,8,9,1]; const rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];const home=(i===0)?(r%2===0?a:b):((r+i)%2===0?a:b);pairs.push(home===a?[a,b]:[b,a]);}
    rounds.push(pairs); arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
  }
  return rounds.concat(rounds.map(p=>p.map(([h,a])=>[a,h])));
}
function blankTeam(t){return {...t,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0};}
function newGame(){
  const players=PLANTILLA.map(([n,pos])=>makePlayer(n,pos));
  S={v:2,staffV:2,rosterV:3,numV:1,temporada:2026,j:0,players,staff:COS_TECNIC.map(s=>({...s})),
     teams:[blankTeam({nom:"Sunyer CF",curt:"SUN",r:0,c:"#C4122F",me:true}),...RIVALS.map(blankTeam)],
     fixtures:buildFixtures(),phase:"club",tab:"club",xi:[],match:null,sessions:0,trainLog:[],history:[],lastRound:[],postInj:[]};
  S.xi=autoXI();
}
function migrate(o){ // v1.1 -> v1.2: Adrián Martos era en Chucky; Robert Besó davanter; alta de Pau Estopà
  if((o.rosterV||0)<3&&o.players.some(p=>p.nom==="Adrián Martos")){
    o.players=o.players.filter(p=>p.nom!=="Adrián Martos");o.xi=o.xi.filter(id=>id!=="p13");
    const rb=o.players.find(p=>p.nom==="Robert Besó");if(rb){rb.pos="DAV";rb.conf=true;}
    o.players.push(makePlayer("Pau Estopà","DEF"));
    if(o.match){delete o.match.pos["p13"];}
  }
  if((o.staffV||0)<2){ // v1.4: cos tècnic real
    const upd={0:["Entrenador","Quim Huguet"],1:["Segona entrenadora","Tania Besó"],2:["Fisioterapeuta","Claudia Huguet"],4:["Delegada","Lusima Sanchez"]};
    Object.entries(upd).forEach(([i,[rol,nom]])=>{if(o.staff[i]){o.staff[i].rol=rol;o.staff[i].nom=nom;}});
    o.staffV=2;
  }
  if((o.rosterV||0)<3){ // v1.5: plantilla definitiva. Es refà la plantilla i es conserven les lesions.
    const old={};o.players.forEach(p=>{old[p.nom]=p;});
    const alias={"Adrián Martos":["Chucky","Xuki","Adrián Martos"],"Abdourahmane Samba":["Abdou Sambeh"]};
    const idMap={};
    o.players=PLANTILLA.map(([n,pos])=>{const np=makePlayer(n,pos);const prev=(alias[n]||[n]).map(k=>old[k]).find(Boolean);
      if(prev){np.inj=prev.inj||0;idMap[prev.id]=np.id;}return np;});
    o.xi=(o.xi||[]).map(id=>idMap[id]).filter(Boolean);
    if(o.phase==="match"||o.phase==="lineup"){o.match=null;o.phase="club";}
    o.rosterV=3; o._rebuiltXI=true;
  }
  if((o.numV||0)<1){o.players.forEach(p=>{if(DORSALS[p.nom])p.num=DORSALS[p.nom];});o.numV=1;} // v1.8: dorsals oficials
  return o;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);if(o&&o.v===2)return migrate(o);}}catch(e){}return null;}

const P=id=>S.players.find(p=>p.id===id);
const staffName=i=>{const s=S.staff[i];return s.nom&&s.nom!=="Per confirmar"?s.nom:s.rol;};
const avail=()=>S.players.filter(p=>p.inj<=0);
function autoXI(){
  const a=avail(); const by=pos=>a.filter(p=>p.pos===pos).sort((x,y)=>ovr(y)-ovr(x));
  const gk=by("POR")[0]||a.slice().sort((x,y)=>y.por-x.por)[0];
  const need={DEF:4,MIG:3,DAV:3}; let xi=[gk.id];
  for(const pos of ["DEF","MIG","DAV"]) by(pos).slice(0,need[pos]).forEach(p=>xi.push(p.id));
  const rest=a.filter(p=>!xi.includes(p.id)&&p.pos!=="POR").sort((x,y)=>ovr(y)-ovr(x));
  while(xi.length<11&&rest.length) xi.push(rest.shift().id);
  return xi;
}
function xiGK(){return S.xi.map(P).find(p=>p.pos==="POR")||P(S.xi[0]);}
function xiField(){const g=xiGK();return S.xi.map(P).filter(p=>p!==g);}
function teamRating(){const xi=S.xi.map(P);return Math.round(xi.reduce((s,p)=>s+ovr(p),0)/xi.length);}
function oppRating(i){return RIVALS[i-1].r + (S.temporada-2026)*1.5 + S.j*0.3;}
function myFixture(j=S.j){const f=S.fixtures[j].find(p=>p.includes(ME));return {home:f[0]===ME,opp:f[0]===ME?f[1]:f[0]};}
function myPos(){const t=S.teams.map((x,i)=>({...x,i})).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf);return t.findIndex(x=>x.me)+1;}

/* ====== PARTIT ====== */
function startMatch(){
  const {home,opp}=myFixture();
  const plays=[];for(let k=0;k<4;k++){home?plays.push("atac","defensa"):plays.push("defensa","atac");}
  S.match={opp,home,gf:0,gc:0,plays,i:0,res:[],pos:{},form:null,msg:null,events:[],subs:0,subsOpen:false};
  newPlay(); S.phase="match"; save(); render(); whistle(1);
}
function newPlay(){
  const m=S.match; const kind=m.plays[m.i];
  m.form=oppFormation(kind,oppRating(m.opp)); m.msg=null; propose();
}
const minute=i=>Math.round((i+1)*90/8);
function placed(){const m=S.match;return xiField().filter(p=>m.pos[p.id]);}
function evalNow(){
  const m=S.match, kind=m.plays[m.i];
  const mine=placed().map(p=>({id:p.id,x:m.pos[p.id].x,y:m.pos[p.id].y,ata:p.ata,def:p.def,fis:p.fis}));
  const opp=m.form.men.map((o,k)=>({...o,k}));
  const bonus=(m.home?0.02:0)+(teamRating()-oppRating(m.opp))/400;
  if(kind==="atac") return {kind,ev:evalPlay(mine,opp,oppRating(m.opp),bonus),mine,opp};
  return {kind,ev:evalPlay(opp,mine,xiGK().por,-bonus),mine,opp};
}
function jitter(c,taken){for(let k=0;k<30;k++){const q={x:clamp(c.x+rnd(-7,7),4,96),y:clamp(c.y+rnd(-6,6),4,64)};if(Object.values(taken).every(o=>dist(o,q)>8))return q;}return {x:clamp(c.x,4,96),y:clamp(c.y,4,64)};}
/* La màquina (segon entrenador) proposa la col·locació; no és perfecta, l'usuari la pot millorar. */
function propose(){
  const m=S.match, kind=m.plays[m.i]; m.pos={};
  const field=xiField().slice();
  if(kind==="atac"){
    const five=field.sort((a,b)=>b.ata-a.ata).slice(0,5);
    const c=[];for(let x=10;x<=90;x+=8)for(let y=8;y<=56;y+=6)c.push({x,y});
    const sc=c.map(p=>({...p,s:Math.min(...m.form.men.map(d=>dist(p,d)))*(1.25-p.y/68)})).sort((a,b)=>b.s-a.s);
    const chosen=[];for(const p of sc){if(chosen.every(q=>dist(q,p)>12))chosen.push(p);if(chosen.length===5)break;}
    five.forEach((p,i)=>m.pos[p.id]=jitter(chosen[i],m.pos));
  } else {
    const five=field.sort((a,b)=>b.def-a.def).slice(0,5);
    const threats=m.form.men.slice().sort((a,b)=>dist(a,GOAL)-dist(b,GOAL));
    const zone=[{x:36,y:16},{x:64,y:16}];
    five.forEach((p,i)=>{if(i>=3){m.pos[p.id]=jitter(zone[i-3],m.pos);return;}
      const t=threats[i];const dx=(GOAL.x-t.x),dy=(GOAL.y-t.y),L=Math.hypot(dx,dy)||1;
      m.pos[p.id]=jitter({x:t.x+dx/L*4,y:t.y+dy/L*4},m.pos);});
  }
}
function coachTip(r){
  const who=staffName(1); const {kind,ev,mine}=r;
  if(kind==="atac"){
    if(mine.length<3) return `${who}: “Posa almenys 3 jugadors al camp, que sols no arribarem.”`;
    if(ev.sh.open<0.5) return `${who}: “El rematador està massa marcat. Mou-lo a l'espai entre dos defenses.”`;
    if(zoneF(ev.sh)<0.7) return `${who}: “Estem lluny de la porteria. Acosta algú a l'àrea.”`;
    if(!ev.passer||ev.passer.open<0.5) return `${who}: “Falta una línia de passada neta. Desmarca un company.”`;
    return `${who}: “Bona col·locació! En ${P(ev.sh.id).curt} té espai per rematar.”`;
  } else {
    if(mine.length<3) return `${who}: “Necessitem més gent al darrere! Posa fins a 5 defensors.”`;
    if(ev.sh.open>0.6) return `${who}: “Hi ha un rival sol a prop de l'àrea (anella vermella). Marca'l per davant!”`;
    if(ev.passer&&ev.passer.open>0.7) return `${who}: “Talla la línia de passada: tenen un home lliure per assistir.”`;
    return `${who}: “Ben tancats. Mantingueu-vos entre el rival i la porteria.”`;
  }
}
function doSub(){
  const m=S.match, out=$("#subOut").value, inn=$("#subIn").value;
  if(!out||!inn||m.subs>=5) return;
  const i=S.xi.indexOf(out); if(i<0) return;
  S.xi[i]=inn; if(m.pos[out]){m.pos[inn]=m.pos[out];delete m.pos[out];}
  m.subs++; m.events.push(`Canvi: entra ${P(inn).nom} per ${P(out).nom}`); m.msg=`Canvi fet. Et queden ${5-m.subs}.`;
  save(); render();
}
function playNow(){
  if(busy) return; const m=S.match; const r=evalNow();
  if(!r.mine.length){m.msg="Col·loca almenys un jugador al camp.";render();return;}
  const goal=Math.random()<r.ev.p; busy=true;
  animatePlay(r,goal,()=>{
    const win=r.kind==="atac"?goal:!goal;
    if(r.kind==="atac"&&goal) m.gf++; if(r.kind==="defensa"&&goal) m.gc++;
    m.res.push(win?"w":"l");
    const min=minute(m.i)+"'";
    m.events.push(r.kind==="atac"?(goal?`${min} GOL de ${shown(P(r.ev.sh.id))}`:`${min} Ocasió del Sunyer, sense premi`):(goal?`${min} Gol de ${S.teams[m.opp].nom}`:r.gkSave?`${min} Parada de ${shown(xiGK())}!`:`${min} Atac rival aturat`));
    if(Math.random()<0.025*0.7&&r.mine.length){injure(P(pick(r.mine).id),true);}
    m.i++; busy=false;
    if(m.i>=m.plays.length){endMatch();whistle(3,true);} else {newPlay(); save(); render(); if(m.i===4) whistle(2);
      else if(m.plays[m.i]==="defensa"&&xiGK().alias&&Math.random()<.5) setTimeout(()=>chantSound(xiGK().alias,true),700);}
  });
}
function injure(p,duringMatch){
  const d=pick([1,1,1,2,2,3,4]); p.inj=d;
  const txt=`${p.nom} (${p.pos}) lesionat · ${d} jornad${d>1?"es":"a"} de baixa`;
  if(duringMatch){
    S.match.events.push("Lesió: "+txt);
    const idx=S.xi.indexOf(p.id);
    if(idx>=0){const sub=avail().filter(q=>!S.xi.includes(q.id)).sort((a,b)=>(b.pos===p.pos)-(a.pos===p.pos)||ovr(b)-ovr(a))[0];
      if(sub){S.xi[idx]=sub.id;S.match.events.push(`Entra ${sub.nom} per ${p.nom}`);} else S.xi.splice(idx,1);}
  } else S.postInj.push(txt);
  return txt;
}
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
function applyResult(h,a,gh,ga){
  const H=S.teams[h],A=S.teams[a];H.pj++;A.pj++;H.gf+=gh;H.gc+=ga;A.gf+=ga;A.gc+=gh;
  if(gh>ga){H.pg++;A.pp++;H.pts+=3;}else if(gh<ga){A.pg++;H.pp++;A.pts+=3;}else{H.pe++;A.pe++;H.pts++;A.pts++;}
}
function endMatch(){
  const m=S.match; S.postInj=[];
  const h=m.home?ME:m.opp, a=m.home?m.opp:ME, gh=m.home?m.gf:m.gc, ga=m.home?m.gc:m.gf;
  S.players.forEach(p=>{if(p.inj>0&&!m.events.some(e=>e.includes(p.nom+" (")))p.inj=Math.max(0,p.inj-1-(Math.random()<0.2?1:0));});
  applyResult(h,a,gh,ga);
  S.lastRound=[{h,a,gh,ga}];
  S.fixtures[S.j].filter(f=>!f.includes(ME)).forEach(([x,y])=>{
    const rx=oppRating(x),ry=oppRating(y);
    const g1=poisson(1.35*Math.pow(rx/ry,2)),g2=poisson(1.05*Math.pow(ry/rx,2));applyResult(x,y,g1,g2);S.lastRound.push({h:x,a:y,gh:g1,ga:g2});
  });
  S.xi.map(P).forEach(p=>{if(p.inj<=0&&Math.random()<0.03*0.7)injure(p,false);});
  const res=m.gf>m.gc?"V":m.gf<m.gc?"D":"E";
  S.history.push({j:S.j,opp:m.opp,home:m.home,gf:m.gf,gc:m.gc,res});
  S.sessions=3+1+(res==="V"?1:0);
  S.trainLog=[]; S.phase="post"; save(); render();
}

/* ====== ENTRENAMENTS ====== */
const SESSIONS=[
  {k:"atac",t:"Atac",d:"Rondos i finalització. +ATA a tota la plantilla (més als migcampistes i davanters)."},
  {k:"defensa",t:"Defensa",d:"Línies i marcatges. +DEF a tota la plantilla (més als defenses)."},
  {k:"fisic",t:"Físic intens",d:"+FIS a tothom, però amb risc de lesió."},
  {k:"porters",t:"Porters",d:"Treball específic amb l'entrenador de porters. +POR molt alt."},
  {k:"recup",t:"Recuperació",d:"Fisioteràpia i piscina. Els lesionats tornen abans."}
];
function gain(p,stat,amt){let g=0;for(let k=0;k<amt;k++)if(Math.random()<(95-p[stat])/110){p[stat]=Math.min(95,p[stat]+1);g++;}return g;}
function train(k){
  if(S.sessions<=0) return;
  const fit=avail(), out=[]; let tot=0; const best=[];
  const note=(p,st,g)=>{if(g>0){tot+=g;best.push([p,st,g]);}};
  if(k==="atac") fit.filter(p=>p.pos!=="POR").forEach(p=>note(p,"ATA",gain(p,"ata",p.pos==="DEF"?1:2)));
  if(k==="defensa") fit.filter(p=>p.pos!=="POR").forEach(p=>note(p,"DEF",gain(p,"def",p.pos==="DEF"?2:1)));
  if(k==="fisic"){fit.forEach(p=>note(p,"FIS",gain(p,"fis",2)));fit.forEach(p=>{if(Math.random()<0.02*0.7)out.push({c:"down",t:"Lesió: "+injure(p,false)});});}
  if(k==="porters") fit.filter(p=>p.pos==="POR").forEach(p=>note(p,"POR",gain(p,"por",4)));
  if(k==="recup"){const inj=S.players.filter(p=>p.inj>0);inj.forEach(p=>{p.inj=Math.max(0,p.inj-1);});out.push({c:"up",t:inj.length?`Recuperació: ${inj.map(p=>p.nom+(p.inj?` (queden ${p.inj})`:" (alta!)")).join(", ")}`:"Cap jugador lesionat. Sessió de descans."});}
  if(k.startsWith("indiv:")){const p=P(k.slice(6));const st=p.pos==="POR"?"por":p.pos==="DEF"?"def":"ata";note(p,st.toUpperCase(),gain(p,st,3));note(p,"FIS",gain(p,"fis",1));}
  const title=k.startsWith("indiv:")?`Individual · ${P(k.slice(6)).nom}`:SESSIONS.find(s=>s.k===k).t;
  if(k!=="recup") out.unshift({c:"up",t:`${title}: +${tot} punts repartits`+(best.length?` · ${best.sort((a,b)=>b[2]-a[2]).slice(0,4).map(([p,st,g])=>`${p.curt} +${g} ${st}`).join(", ")}`:" · sense millores aquesta vegada")});
  S.trainLog=out.concat(S.trainLog); S.sessions--; save(); render();
}
function nextRound(){
  S.j++; S.match=null;
  if(S.j>=S.fixtures.length){S.phase="end";}
  else {S.xi=S.xi.filter(id=>P(id).inj<=0); if(S.xi.length<11) S.xi=autoXI(); S.phase="club"; S.tab="club";}
  save(); render();
}
function newSeason(){
  S.temporada++; S.j=0; S.history=[]; S.lastRound=[]; S.teams=S.teams.map(blankTeam); S.fixtures=buildFixtures();
  S.players.forEach(p=>p.inj=0); S.xi=autoXI(); S.phase="club"; S.tab="club"; save(); render();
}

/* ====== SO ======
   Tot el so es genera al moment amb Web Audio (res de fitxers). El càntic de la grada fa servir la veu del navegador. */
const SND={on:false,ctx:null,master:null,amb:null,noise:null};
try{SND.on=localStorage.getItem("sunyercf-so")==="1";}catch(e){}
function ac(){
  if(!SND.on) return null;
  if(!SND.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    SND.ctx=new C();SND.master=SND.ctx.createGain();SND.master.gain.value=.9;const comp=SND.ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;SND.master.connect(comp);comp.connect(SND.ctx.destination);}
  if(SND.ctx.state==="suspended") SND.ctx.resume();
  return SND.ctx;
}
function noiseBuf(c){if(SND.noise)return SND.noise;const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return SND.noise=b;}
function noiseNode(c,type,freq,q){const s=c.createBufferSource();s.buffer=noiseBuf(c);s.loop=true;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;s.connect(f);return {s,f};}
function env(g,t,a,peak,hold,rel){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.setValueAtTime(peak,t+a+hold);g.gain.exponentialRampToValueAtTime(.0001,t+a+hold+rel);}
function whistle(n=1,long=false){const c=ac();if(!c)return;let t=c.currentTime+.05;
  for(let k=0;k<n;k++){const o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),g=c.createGain();
    o.type="sine";o.frequency.value=2850;l.frequency.value=28;lg.gain.value=90;l.connect(lg);lg.connect(o.frequency);
    o.connect(g);g.connect(SND.master);const d=(long&&k===n-1)?.9:.32;env(g,t,.02,.18,d,.08);o.start(t);l.start(t);o.stop(t+d+.2);l.stop(t+d+.2);t+=d+.18;}}
function kick(){const c=ac();if(!c)return;const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);o.connect(g);g.connect(SND.master);env(g,t,.005,.45,0,.14);o.start(t);o.stop(t+.2);}
function roar(dur=2.6,peak=.45,freq=900){const c=ac();if(!c)return;const t=c.currentTime;
  const out=c.createGain();env(out,t,.25,1,dur*.45,dur*.55);out.connect(SND.master);
  const n=Math.round(40*dur);for(let k=0;k<n;k++){const tt=t+Math.random()*dur*.8;const o=c.createOscillator();o.type="sawtooth";const f0=160+Math.random()*260;
    o.frequency.setValueAtTime(f0,tt);o.frequency.linearRampToValueAtTime(f0*1.15,tt+.5);const f1=c.createBiquadFilter();f1.type="bandpass";f1.frequency.value=freq*(.7+Math.random()*.6);f1.Q.value=3;
    const g=c.createGain();env(g,tt,.08,peak*.09,.35,.4);o.connect(f1);f1.connect(g);g.connect(out);o.start(tt);o.stop(tt+1);}
  const {s:ns,f}=noiseNode(c,"bandpass",freq,.8),ng=c.createGain();ng.gain.value=peak*.25;f.connect(ng);ng.connect(out);ns.start(t);ns.stop(t+dur+.5);}
function groan(){const c=ac();if(!c)return;const t=c.currentTime,{s,f}=noiseNode(c,"lowpass",900,1),g=c.createGain();
  f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(180,t+1.3);f.connect(g);g.connect(SND.master);env(g,t,.1,.28,.3,1);s.start(t);s.stop(t+1.6);}
function clap(at,v=.5){const c=ac();if(!c)return;const {s,f}=noiseNode(c,"highpass",1400,.7),g=c.createGain();f.connect(g);g.connect(SND.master);env(g,at,.002,v,0,.09);s.start(at);s.stop(at+.15);}
function drum(at,v=.6){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(110,at);o.frequency.exponentialRampToValueAtTime(50,at+.18);o.connect(g);g.connect(SND.master);env(g,at,.005,v,0,.25);o.start(at);o.stop(at+.3);}
function say(text,opts={}){if(!SND.on||!("speechSynthesis" in window))return;try{
  const u=new SpeechSynthesisUtterance(text);const vs=speechSynthesis.getVoices();
  u.voice=vs.find(v=>/^ca/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;u.lang=u.voice?u.voice.lang:"ca-ES";
  u.rate=opts.rate||1.1;u.pitch=opts.pitch||1;u.volume=1;speechSynthesis.speak(u);}catch(e){}}
/* Grada d'animació: xerrameca de moltes veus (grans de veu amb formants), bombo i mans de la penya
   a ritme constant i càntics cada pocs segons. */
const CANTICS=[
  [["Sun",67,.34],["yer!",64,.5],["Sun",67,.34],["yer!",64,.7]],
  [["Som",64,.3],["hi",67,.3],["Sun",69,.34],["yer!",67,.7]],
  [["O",64,.32],["é",67,.32],["o",64,.3],["é",67,.3],["o",69,.3],["é",67,.6]],
  [["Xuts!",62,.45],["Xuts!",62,.45],["Xuts!",67,.7]]
];
function voiceGrain(c,t,out,vol){
  const vs=[VOW.a,VOW.e,VOW.u,VOW.y,[600,1000],[400,2000]];const fm=vs[Math.floor(Math.random()*vs.length)];
  const f0=95+Math.random()*170,d=.12+Math.random()*.3;
  const o=c.createOscillator();o.type="sawtooth";o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*(.85+Math.random()*.35),t+d);
  const f1=c.createBiquadFilter(),f2=c.createBiquadFilter();f1.type=f2.type="bandpass";f1.frequency.value=fm[0];f2.frequency.value=fm[1];f1.Q.value=5;f2.Q.value=7;
  const g=c.createGain();env(g,t,.03,vol,d*.4,d*.5);o.connect(f1);o.connect(f2);f1.connect(g);f2.connect(g);g.connect(out);o.start(t);o.stop(t+d+.1);
}
function ambient(on){
  const c=SND.ctx;
  if(!on||!SND.on){if(SND.amb&&c){const a=SND.amb;SND.amb=null;clearInterval(a.timer);a.g.gain.setTargetAtTime(0,c.currentTime,.3);setTimeout(()=>{try{a.air.stop();a.g.disconnect();}catch(e){}},1500);}return;}
  if(SND.amb) return; const cc=ac(); if(!cc) return;
  const home=!!(S.match&&S.match.home);
  const g=cc.createGain();g.gain.value=0;g.connect(SND.master);g.gain.setTargetAtTime(1,cc.currentTime,.6);
  // una mica d'aire d'estadi obert (molt fluix, sense onades)
  const air=noiseNode(cc,"highpass",2500,.5),ag=cc.createGain();ag.gain.value=.012;air.f.connect(ag);ag.connect(g);air.s.start();
  const st={g,air:air.s,next:cc.currentTime+.1,beat:0,nextChant:cc.currentTime+3+Math.random()*3,home};
  const bpm=home?118:104,spb=60/bpm;
  st.timer=setInterval(()=>{
    if(!SND.on||SND.amb!==st)return;const x=SND.ctx;if(!x||x.state!=="running")return;
    const now=x.currentTime;if(st.next<now)st.next=now+.05;
    while(st.next<now+.25){
      const t=st.next;
      // xerrameca de la grada: diversos grans per pas
      const n=home?5:3;for(let k=0;k<n;k++)voiceGrain(x,t+Math.random()*spb,g,home?.035:.025);
      // bombo i picades de mans (patró de penya: BUM · BUM BUM ·)
      if(!busy){const b=st.beat%4;
        if(home||st.beat%8<4){ if(b===0||b===2||b===3) drum(t,home?.4:.22); if(b===1||b===3) clap(t+spb*.5,home?.22:.12);}
      }
      st.beat++;st.next+=spb;
    }
    // càntic de la grada cada 7-12 s (no durant la celebració)
    if(now>st.nextChant&&!busy){crowdChant(pick(CANTICS),home?.13:.07,now+.1);st.nextChant=now+7+Math.random()*5;}
  },60);
  SND.amb=st;
}
/* Grada cantant: moltes veus lleugerament desafinades passades per filtres de vocal (formants). */
const VOW={u:[330,870],y:[300,2200],e:[520,1850],a:[750,1200]};
function vowelOf(syl){const v=syl.toLowerCase().match(/[aeiouy]/g);return (v&&v[v.length-1])||"e";}
function crowdChant(seq,vol=.18,startAt){
  const c=ac();if(!c)return 0;let t=startAt||c.currentTime+.05;
  for(const [syl,midi,dur] of seq){
    const f0=440*Math.pow(2,(midi-69)/12), fm=VOW[vowelOf(syl)]||VOW.e;
    const out=c.createGain();env(out,t,.04,vol,dur*.55,dur*.4);
    const f1=c.createBiquadFilter(),f2=c.createBiquadFilter();f1.type=f2.type="bandpass";f1.frequency.value=fm[0];f2.frequency.value=fm[1];f1.Q.value=4;f2.Q.value=6;
    const mix=c.createGain();mix.gain.value=1;mix.connect(f1);mix.connect(f2);f1.connect(out);f2.connect(out);out.connect(SND.master);
    for(let v=0;v<12;v++){const o=c.createOscillator();o.type="sawtooth";o.frequency.value=f0*(v%3===0?0.5:1)*(1+(Math.random()-.5)*.04);
      const vib=c.createOscillator(),vg=c.createGain();vib.frequency.value=4+Math.random()*2;vg.gain.value=f0*.012;vib.connect(vg);vg.connect(o.frequency);vib.start(t);vib.stop(t+dur+.1);
      const og=c.createGain();og.gain.value=.08;o.connect(og);og.connect(mix);const st=t+Math.random()*.04;o.start(st);o.stop(t+dur+.1);}
    if(/^(ch|k|c|s)/i.test(syl)){const {s:n,f:nf}=noiseNode(c,"highpass",2500,.7),ng=c.createGain();nf.connect(ng);ng.connect(SND.master);env(ng,t,.005,vol*.8,.02,.06);n.start(t);n.stop(t+.12);}
    t+=dur;
  }
  return t;
}
function goalSound(){roar(3.4,.55,850);const c=ac();if(!c)return;const t=c.currentTime+.3;[0,.25,.5,1,1.25,1.5,2,2.25,2.5].forEach(d=>drum(t+d));say("Goool del Sunyer!",{rate:.95,pitch:1.1});}
const chantSeq=name=>{const sy=name.length>4&&/y$/i.test(name)?[name.slice(0,name.length-2),name.slice(-2)]:[name,""];
  return [[sy[0],67,.3],[sy[1]||"i",64,.3],[sy[0],67,.3],[sy[1]||"i",64,.34],["eh",72,.36],["eh",72,.55]];};
function chantSound(name,soft=false){const c=ac();if(!c)return;roar(4.2,soft?.08:.2,700);
  let t=c.currentTime+.2;
  for(let r=0;r<3;r++){const t0=t;t=crowdChant(chantSeq(name),soft?.1:.2,t)+.12;
    [0,.6,1.2,1.62].forEach(d=>{drum(t0+d,soft?.3:.55);clap(t0+d+.3,soft?.2:.4);});}
  if(!soft) for(let r=0;r<3;r++) say(`${name}! ${name}! eh! eh!`,{rate:1.2,pitch:1.05});}
function toggleSound(){
  SND.on=!SND.on;try{localStorage.setItem("sunyercf-so",SND.on?"1":"0");}catch(e){}
  if(SND.on){ac();whistle(1);if(S.phase==="match")ambient(true);}else{ambient(false);try{speechSynthesis.cancel();}catch(e){}}
  render();
}

function animatePlay(r,goal,done){
  const ball=$("#ball"), trail=$("#trail"), ov=$("#ov"), btn=$("#play"); if(btn) btn.disabled=true;
  const ev=r.ev, sh=ev.sh, start=ev.passer||sh;
  let stopper=null; if(!goal){const defs=r.kind==="atac"?r.opp:r.mine; if(defs.length&&Math.random()<0.5){stopper=defs.reduce((a,b)=>dist(a,sh)<dist(b,sh)?a:b);} }
  const end=goal?{x:clamp(44+Math.random()*12,45,55),y:-2}:stopper?{x:stopper.x,y:stopper.y}:{x:50+rnd(-2,2),y:2.4};
  const legs=[[start,sh],[sh,end]].filter(([a,b])=>dist(a,b)>0.5);
  const sunyerGoal=r.kind==="atac"&&goal;
  const txt=r.kind==="atac"?(stopper?"Tallada":"Aturada"):(goal?"Gol rival":stopper?"Recuperada!":"Aturada!");
  const gk=r.kind==="defensa"?xiGK():null;
  r.gkSave=!!(gk&&!goal&&!stopper);
  const show=()=>{if(sunyerGoal){goalSound();celebrate(shown(P(sh.id)),done);return;}
    if(r.gkSave&&gk.alias){chantSound(gk.alias);celebrate(gk.alias,done,"parada");return;}
    if(r.kind==="defensa"&&goal)groan();else if(r.kind==="atac")groan();else roar(1.4,.22);
    ov.innerHTML=`<div class="big">${txt}</div>`;setTimeout(done,1100);};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||!ball){show();return;}
  ball.style.display="";trail.style.display=""; let li=0,t0=null,prev=null; kick();
  const step=ts=>{if(!t0)t0=ts;const [a,b]=legs[li]||[sh,end];const dur=li===0?430:360;const k=Math.min(1,(ts-t0)/dur);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const x=a.x+(b.x-a.x)*e,y=a.y+(b.y-a.y)*e;if(prev){trail.setAttribute("cx",prev.x);trail.setAttribute("cy",prev.y);}prev={x,y};
    ball.setAttribute("cx",x);ball.setAttribute("cy",y);
    if(k>=1){li++;t0=null;if(li<legs.length)kick();if(li>=legs.length){trail.style.display="none";show();return;}}requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

function viewPost(){
  const r=S.history[S.history.length-1], m=S.match;
  const title=r.res==="V"?"Victòria!":r.res==="D"?"Derrota":"Empat";
  return board("Final")+`<section class="card"><div class="row spread"><h2>${title}</h2><span class="label">Jornada ${S.j+1}</span></div>
    ${r.res==="V"?`<div class="row" style="gap:12px"><img src="${XUTS_LOGO}" alt="" style="width:46px;height:46px;border-radius:50%"><span class="muted">La grada dels Supporters Xuts celebra els tres punts.</span></div>`:""}
    <div class="log">${m.events.map(e=>`<div class="${e.includes("GOL de")||e.includes("aturat")||e.includes("Parada")?"up":/Gol de|Lesió/.test(e)?"down":""}">${esc(e)}</div>`).join("")}</div>
    ${S.postInj.length?`<div><span class="label">Parte mèdic</span><div class="log">${S.postInj.map(t=>`<div class="down">${esc(t)}</div>`).join("")}</div></div>`:""}
    <div><span class="label">Resultats de la jornada</span><div class="tbl-wrap"><table><tbody>${S.lastRound.map(x=>`<tr class="${x.h===ME||x.a===ME?"me":""}"><td>${esc(S.teams[x.h].nom)}</td><td class="c num"><b>${x.gh} – ${x.ga}</b></td><td>${esc(S.teams[x.a].nom)}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="row spread"><span class="muted">Aquesta setmana tens <b>${S.sessions}</b> sessions d'entrenament${r.res==="V"?" (una extra per la victòria)":""}.</span><button class="btn" onclick="S.phase='train';save();render()">Anar a entrenar</button></div></section>
    <section class="card"><h3>Classificació</h3>${table()}</section>`;
}
function viewTrain(){
  const fit=avail();
  return `<section class="card"><div class="row spread"><h2>Entrenament setmanal</h2><div class="dots" aria-label="${S.sessions} sessions restants">${[...Array(5)].map((_,i)=>`<i class="${i<S.sessions?"":"off"}"></i>`).join("")}</div></div>
    <span class="muted">Tria en què treballa l'equip abans de la jornada ${S.j+2}. Dirigeix: <b>${esc(staffName(0))}</b>.</span>
    <div class="sessions">${SESSIONS.map(s=>`<button class="session" ${S.sessions?"":"disabled"} onclick="train('${s.k}')"><b>${s.t}</b><span>${s.d}</span></button>`).join("")}</div>
    <div class="row"><label class="label" for="indiv">Sessió individual</label><select id="indiv">${fit.sort((a,b)=>a.num-b.num).map(p=>`<option value="${p.id}">${p.num} · ${esc(p.nom)} (${p.pos})</option>`).join("")}</select><button class="btn small" ${S.sessions?"":"disabled"} onclick="train('indiv:'+$('#indiv').value)">Entrenar</button></div>
    ${S.trainLog.length?`<div class="log">${S.trainLog.map(l=>`<div class="${l.c}">${esc(l.t)}</div>`).join("")}</div>`:""}
    <div class="row spread"><span class="muted">Mitjana de l'onze: <b class="num">${teamRating()}</b></span><button class="btn" onclick="nextRound()">${S.j+1>=S.fixtures.length?"Final de temporada":"Següent jornada"}</button></div></section>`;
}
function viewEnd(){
  const pos=myPos(), me=S.teams[ME];
  return `<section class="card"><span class="label">Final de la temporada ${seasonTxt()}</span><h2>${pos===1?"Campions del grup 29!":pos<=3?`${pos}a posició, temporada de podi!`:`${pos}a posició`}</h2>
    <span class="muted num">${me.pts} punts · ${me.pg}G ${me.pe}E ${me.pp}P · ${me.gf} gols a favor, ${me.gc} en contra</span>${table()}
    <div class="row"><button class="btn" onclick="newSeason()">Començar la temporada ${S.temporada+1}/${String(S.temporada+2).slice(2)}</button></div>
    <span class="foot">La plantilla conserva les millores. Els rivals també es reforcen.</span></section>`;
}

/* ====== ARRENCADA ====== */
function start(data){
  S=(data&&data.S&&data.S.v===2)?data.S:load();
  if(!S){newGame();save();}
  if(S.phase==="match"&&!S.match) S.phase="club";
  if(S._rebuiltXI){delete S._rebuiltXI;const xi=S.xi.filter(id=>P(id)&&P(id).inj<=0);S.xi=xi.length===11?xi:autoXI();save();}
  busy=false; render();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body></html>
